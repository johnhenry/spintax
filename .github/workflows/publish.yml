name: Publish to npm

on:
  release:
    types: [published]
  push:
    # Redundant with the release trigger above -- see fileable's publish.yml
    # for the full incident writeup. `gh release create` also creates the
    # underlying git tag, so this gives the workflow a second, independent
    # chance to fire if the release event is ever silently dropped. Safe to
    # double-fire: the idempotent `npm view` guard makes a second run a
    # clean no-op.
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required by the reusable workflow's provenance step --
        # see johnhenry/workflows' README for why this must be declared here too.
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      # spintax has zero dependencies and no committed package-lock.json.
      install-command: npm install
      node-cache: ""
      gate-commands: npm test
    secrets: inherit
