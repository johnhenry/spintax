name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      # spintax has zero dependencies and no committed package-lock.json.
      install-command: npm install
      node-cache: ""
      gate-commands: |
        npm test
        npm run examples
